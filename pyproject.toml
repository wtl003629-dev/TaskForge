[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskforge-agent"
version = "0.1.0"
description = "A provider-neutral, permission-governed general Agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pdfplumber>=0.11.10,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=6.14,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
rag = [
  "qdrant-client>=1.18,<2",
]
evaluation = [
  "reportlab>=5,<6",
]
semantic = [
  "fastembed>=0.8,<1",
  "qdrant-client>=1.18,<2",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
graph = [
  "neo4j>=5.20,<7",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "qdrant-client>=1.18,<2",
  "reportlab>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/taskforge"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
