[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskforge-agent"
version = "0.1.0"
description = "A provider-neutral, permission-governed general Agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.8,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pdfplumber>=0.11.10,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=6.14,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
rag = [
  "qdrant-client>=1.18,<2",
]
evaluation = [
  "pyarrow>=18,<24",
  "reportlab>=5,<6",
]
semantic = [
  "qdrant-client>=1.18,<2",
  "FlagEmbedding>=1.3,<2",
]
reranker = [
  "FlagEmbedding>=1.3,<2",
  "transformers>=4.44,<5",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]
graph = [
  "neo4j>=5.20,<7",
]
dev = [
  "pyarrow>=18,<24",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "qdrant-client>=1.18,<2",
  "reportlab>=5,<6",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/taskforge"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
extend-exclude = ["logs", ".taskforge", "frontend/dist"]

[tool.ruff.lint]
# ruff's default pycodestyle subset (E4/E7/E9) plus pyflakes (F) and import
# sorting (I): real errors and hygiene without line-length style churn.
# More opinionated preview rules (TRY004, BLE001, SIM*, PYI*, ...) are
# intentionally not selected: this runtime deliberately raises ValueError
# for invalid values and catches broad exceptions only at the untrusted
# tool/provider integration boundary.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["taskforge"]

[tool.ruff.lint.per-file-ignores]
# Runnable scripts bootstrap ``backend`` onto sys.path before imports.
"scripts/*.py" = ["E402"]
