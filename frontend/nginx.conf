server {
    listen 80;
    server_name _;

    # Docker service IPs can change whenever a container is recreated. Resolve
    # the backend through Docker's embedded DNS at request time so nginx does
    # not keep routing to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Report generation can legitimately span several model calls. Keep the
        # browser connection open beyond nginx's 60-second default while the
        # backend enforces its own bounded model timeouts and iteration limit.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 900s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
