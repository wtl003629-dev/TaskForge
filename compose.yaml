x-taskforge-ai-environment: &taskforge-ai-environment
  TASKFORGE_GENERAL_TEXT_BACKEND: ${TASKFORGE_GENERAL_TEXT_BACKEND:-fastembed}
  TASKFORGE_SEMANTIC_MODEL: ${TASKFORGE_SEMANTIC_MODEL:-BAAI/bge-small-en-v1.5}
  TASKFORGE_SEMANTIC_MODEL_PATH: ${TASKFORGE_SEMANTIC_MODEL_PATH:-}
  TASKFORGE_SEMANTIC_BATCH_SIZE: ${TASKFORGE_SEMANTIC_BATCH_SIZE:-64}
  TASKFORGE_SEMANTIC_DEVICE: ${TASKFORGE_SEMANTIC_DEVICE:-auto}
  TASKFORGE_SEMANTIC_CACHE_PATH: ${TASKFORGE_SEMANTIC_CACHE_PATH:-.taskforge/embeddings.sqlite3}
  TASKFORGE_BAILIAN_API_KEY: ${TASKFORGE_BAILIAN_API_KEY:-}
  TASKFORGE_BAILIAN_BASE_URL: ${TASKFORGE_BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  TASKFORGE_BAILIAN_CHAT_MODEL: ${TASKFORGE_BAILIAN_CHAT_MODEL:-qwen-plus}
  TASKFORGE_BAILIAN_CHAT_TIMEOUT_SECONDS: ${TASKFORGE_BAILIAN_CHAT_TIMEOUT_SECONDS:-180}
  TASKFORGE_BAILIAN_CHAT_TRUST_ENV: ${TASKFORGE_BAILIAN_CHAT_TRUST_ENV:-false}
  TASKFORGE_BAILIAN_MODEL: ${TASKFORGE_BAILIAN_MODEL:-text-embedding-v4}
  TASKFORGE_BAILIAN_EMBEDDING_DIMENSION: ${TASKFORGE_BAILIAN_EMBEDDING_DIMENSION:-1024}
  TASKFORGE_BAILIAN_BATCH_SIZE: ${TASKFORGE_BAILIAN_BATCH_SIZE:-10}
  TASKFORGE_BAILIAN_TIMEOUT_SECONDS: ${TASKFORGE_BAILIAN_TIMEOUT_SECONDS:-30}
  TASKFORGE_BAILIAN_MAX_RETRIES: ${TASKFORGE_BAILIAN_MAX_RETRIES:-3}
  TASKFORGE_BAILIAN_CACHE_PATH: ${TASKFORGE_BAILIAN_CACHE_PATH:-.taskforge/embeddings-bailian-v4-1024.sqlite3}
  TASKFORGE_BAILIAN_INDEX_NAME: ${TASKFORGE_BAILIAN_INDEX_NAME:-knowledge-bailian-text-embedding-v4-1024-v1}
  TASKFORGE_BAILIAN_RERANK_BASE_URL: ${TASKFORGE_BAILIAN_RERANK_BASE_URL:-https://dashscope.aliyuncs.com/compatible-api/v1}
  TASKFORGE_BAILIAN_RERANK_MODEL: ${TASKFORGE_BAILIAN_RERANK_MODEL:-qwen3-rerank}
  TASKFORGE_BAILIAN_RERANK_TIMEOUT_SECONDS: ${TASKFORGE_BAILIAN_RERANK_TIMEOUT_SECONDS:-30}
  TASKFORGE_BAILIAN_RERANK_MAX_RETRIES: ${TASKFORGE_BAILIAN_RERANK_MAX_RETRIES:-2}
  TASKFORGE_RESEARCH_MULTILINGUAL_SEMANTIC_MODEL: ${TASKFORGE_RESEARCH_MULTILINGUAL_SEMANTIC_MODEL:-}
  TASKFORGE_RESEARCH_RERANKER_BACKEND: ${TASKFORGE_RESEARCH_RERANKER_BACKEND:-fastembed_ensemble}
  TASKFORGE_RESEARCH_RERANKER_MODEL: ${TASKFORGE_RESEARCH_RERANKER_MODEL:-jinaai/jina-reranker-v1-tiny-en,Xenova/ms-marco-MiniLM-L-6-v2}
  TASKFORGE_RESEARCH_MULTILINGUAL_RERANKER_BACKEND: ${TASKFORGE_RESEARCH_MULTILINGUAL_RERANKER_BACKEND:-fastembed}
  TASKFORGE_RESEARCH_MULTILINGUAL_RERANKER_MODEL: ${TASKFORGE_RESEARCH_MULTILINGUAL_RERANKER_MODEL:-}
  TASKFORGE_RESEARCH_RERANKER_DEVICE: ${TASKFORGE_RESEARCH_RERANKER_DEVICE:-auto}
  TASKFORGE_RESEARCH_RERANKER_BATCH_SIZE: ${TASKFORGE_RESEARCH_RERANKER_BATCH_SIZE:-32}
  TASKFORGE_RESEARCH_CONTEXTUAL_CHILD_RERANK_ENABLED: ${TASKFORGE_RESEARCH_CONTEXTUAL_CHILD_RERANK_ENABLED:-false}
  TASKFORGE_RESEARCH_DUAL_ROUTE_ENABLED: ${TASKFORGE_RESEARCH_DUAL_ROUTE_ENABLED:-false}
  TASKFORGE_RESEARCH_REWRITE_ENABLED: ${TASKFORGE_RESEARCH_REWRITE_ENABLED:-false}
  TASKFORGE_RETRIEVAL_ROUTING: ${TASKFORGE_RETRIEVAL_ROUTING:-profile}
  TASKFORGE_RAG_ACTIVE_PROFILE: ${TASKFORGE_RAG_ACTIVE_PROFILE:-current}
  TASKFORGE_RAG_EVALUATION_MODE: ${TASKFORGE_RAG_EVALUATION_MODE:-false}
  TASKFORGE_RAG_EXPERIMENT_PROFILE: ${TASKFORGE_RAG_EXPERIMENT_PROFILE:-}
  TASKFORGE_RAG_OPTIMIZED_ABLATION: ${TASKFORGE_RAG_OPTIMIZED_ABLATION:-}
  TASKFORGE_RAG_OPTIMIZED_PROMOTION_MANIFEST: ${TASKFORGE_RAG_OPTIMIZED_PROMOTION_MANIFEST:-}

services:
  postgres:
    # PostgreSQL is part of the default Compose stack. Set the password
    # variables in .env before the first start.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: migration_admin
      POSTGRES_PASSWORD: ${TASKFORGE_POSTGRES_ADMIN_PASSWORD:-}
      POSTGRES_DB: taskforge
      TASKFORGE_POSTGRES_TASKFORGE_PASSWORD: ${TASKFORGE_POSTGRES_TASKFORGE_PASSWORD:-}
      TASKFORGE_POSTGRES_PATCHPILOT_PASSWORD: ${TASKFORGE_POSTGRES_PATCHPILOT_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - type: bind
        source: ${TASKFORGE_POSTGRES_DATA_ROOT:-D:/TaskForge/postgres}/data
        target: /var/lib/postgresql/data
      - ./deploy/postgres/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
      - ./deploy/postgres/init/002-taskforge-schema.sh:/docker-entrypoint-initdb.d/002-taskforge-schema.sh:ro
      - ./deploy/postgres/init/003-patchpilot-schema.sh:/docker-entrypoint-initdb.d/003-patchpilot-schema.sh:ro
      - ./migrations/postgres/002_taskforge_runtime.sql:/opt/taskforge/002_taskforge_runtime.sql:ro
      - ./migrations/postgres/003_taskforge_hnsw.sql:/opt/taskforge/003_taskforge_hnsw.sql:ro
      - ./migrations/postgres/004_literature_evidence_replace.sql:/opt/taskforge/004_literature_evidence_replace.sql:ro
      - ../PatchPilot/migrations/postgres/001_queue.sql:/opt/patchpilot/001_queue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_admin -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *taskforge-ai-environment
      TASKFORGE_PROVIDER: ${TASKFORGE_PROVIDER:-demo}
      TASKFORGE_DATABASE_BACKEND: ${TASKFORGE_DATABASE_BACKEND:-postgres}
      TASKFORGE_DATABASE_URL: postgresql://taskforge_app:${TASKFORGE_POSTGRES_TASKFORGE_PASSWORD}@postgres:5432/taskforge
      TASKFORGE_POSTGRES_POOL_MIN_SIZE: ${TASKFORGE_POSTGRES_POOL_MIN_SIZE:-1}
      TASKFORGE_POSTGRES_POOL_MAX_SIZE: ${TASKFORGE_POSTGRES_POOL_MAX_SIZE:-8}
      TASKFORGE_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${TASKFORGE_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      TASKFORGE_SQLITE_PATH: /app/.taskforge/taskforge.sqlite3
      TASKFORGE_CONTEXT_SQLITE_PATH: /app/.taskforge/context.sqlite3
      TASKFORGE_OPERATIONS_SQLITE_PATH: /app/.taskforge/operations.sqlite3
      TASKFORGE_CONTEXT_BACKEND: ${TASKFORGE_CONTEXT_BACKEND:-sqlite}
      TASKFORGE_WORKSPACE_ROOT: /app
      TASKFORGE_ARTIFACT_ROOT: /app/.taskforge/artifacts
      TASKFORGE_WORKER_LEASE_SECONDS: ${TASKFORGE_WORKER_LEASE_SECONDS:-30}
      TASKFORGE_WORKER_MAX_ATTEMPTS: ${TASKFORGE_WORKER_MAX_ATTEMPTS:-3}
      TASKFORGE_MCP_CONFIG_PATH: ${TASKFORGE_MCP_CONFIG_PATH:-}
      TASKFORGE_PDF_PARSER_BACKEND: ${TASKFORGE_PDF_PARSER_BACKEND:-auto}
      TASKFORGE_FASTEMBED_MODEL_CACHE_ROOT: ${TASKFORGE_FASTEMBED_MODEL_CACHE_ROOT:-}
      TASKFORGE_MINERU_BASE_URL: ${TASKFORGE_MINERU_BASE_URL:-}
      TASKFORGE_MINERU_EXPECTED_VERSION: ${TASKFORGE_MINERU_EXPECTED_VERSION:-}
      TASKFORGE_MINERU_CACHE_ROOT: ${TASKFORGE_MINERU_CACHE_ROOT:-}
      TASKFORGE_MINERU_BACKEND: ${TASKFORGE_MINERU_BACKEND:-pipeline}
      TASKFORGE_MINERU_PARSE_METHOD: ${TASKFORGE_MINERU_PARSE_METHOD:-auto}
      TASKFORGE_MINERU_EFFORT: ${TASKFORGE_MINERU_EFFORT:-high}
      TASKFORGE_VISUAL_EXTRACTOR_BASE_URL: ${TASKFORGE_VISUAL_EXTRACTOR_BASE_URL:-}
      TASKFORGE_VISUAL_EXTRACTOR_API_KEY: ${TASKFORGE_VISUAL_EXTRACTOR_API_KEY:-}
      TASKFORGE_VISUAL_EXTRACTOR_MODEL: ${TASKFORGE_VISUAL_EXTRACTOR_MODEL:-}
      TASKFORGE_RESEARCH_QUERY_EXPANSION_MODE: ${TASKFORGE_RESEARCH_QUERY_EXPANSION_MODE:-original}
      TASKFORGE_RESEARCH_OPERATOR_BUDGET_STANDARD: ${TASKFORGE_RESEARCH_OPERATOR_BUDGET_STANDARD:-1}
      TASKFORGE_RESEARCH_OPERATOR_BUDGET_RIGOROUS: ${TASKFORGE_RESEARCH_OPERATOR_BUDGET_RIGOROUS:-2}
      TASKFORGE_PDF_CHUNKING_MODE: ${TASKFORGE_PDF_CHUNKING_MODE:-parent_child}
      TASKFORGE_PDF_FLAT_CHUNK_CHARS: ${TASKFORGE_PDF_FLAT_CHUNK_CHARS:-2000}
      TASKFORGE_OPENAI_API_KEY: ${TASKFORGE_OPENAI_API_KEY:-}
      TASKFORGE_OPENAI_MODEL: ${TASKFORGE_OPENAI_MODEL:-}
      TASKFORGE_OPENAI_BASE_URL: ${TASKFORGE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      TASKFORGE_LITERATURE_CONTACT_EMAIL: ${TASKFORGE_LITERATURE_CONTACT_EMAIL:-}
      TASKFORGE_SEMANTIC_SCHOLAR_API_KEY: ${TASKFORGE_SEMANTIC_SCHOLAR_API_KEY:-}
      TASKFORGE_OPENALEX_API_KEY: ${TASKFORGE_OPENALEX_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    ports:
      - "8000:8000"
    volumes:
      - taskforge-data:/app/.taskforge
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/run_worker.py", "--poll-seconds", "0.5"]
    environment:
      <<: *taskforge-ai-environment
      TASKFORGE_PROVIDER: ${TASKFORGE_PROVIDER:-demo}
      TASKFORGE_DATABASE_BACKEND: ${TASKFORGE_DATABASE_BACKEND:-postgres}
      TASKFORGE_DATABASE_URL: postgresql://taskforge_app:${TASKFORGE_POSTGRES_TASKFORGE_PASSWORD}@postgres:5432/taskforge
      TASKFORGE_POSTGRES_POOL_MIN_SIZE: ${TASKFORGE_POSTGRES_POOL_MIN_SIZE:-1}
      TASKFORGE_POSTGRES_POOL_MAX_SIZE: ${TASKFORGE_POSTGRES_POOL_MAX_SIZE:-8}
      TASKFORGE_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${TASKFORGE_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      TASKFORGE_SQLITE_PATH: /app/.taskforge/taskforge.sqlite3
      TASKFORGE_CONTEXT_SQLITE_PATH: /app/.taskforge/context.sqlite3
      TASKFORGE_OPERATIONS_SQLITE_PATH: /app/.taskforge/operations.sqlite3
      TASKFORGE_CONTEXT_BACKEND: ${TASKFORGE_CONTEXT_BACKEND:-sqlite}
      TASKFORGE_WORKSPACE_ROOT: /app
      TASKFORGE_ARTIFACT_ROOT: /app/.taskforge/artifacts
      TASKFORGE_WORKER_LEASE_SECONDS: ${TASKFORGE_WORKER_LEASE_SECONDS:-30}
      TASKFORGE_WORKER_MAX_ATTEMPTS: ${TASKFORGE_WORKER_MAX_ATTEMPTS:-3}
      TASKFORGE_MCP_CONFIG_PATH: ${TASKFORGE_MCP_CONFIG_PATH:-}
      TASKFORGE_PDF_PARSER_BACKEND: ${TASKFORGE_PDF_PARSER_BACKEND:-auto}
      TASKFORGE_FASTEMBED_MODEL_CACHE_ROOT: ${TASKFORGE_FASTEMBED_MODEL_CACHE_ROOT:-}
      TASKFORGE_MINERU_BASE_URL: ${TASKFORGE_MINERU_BASE_URL:-}
      TASKFORGE_MINERU_EXPECTED_VERSION: ${TASKFORGE_MINERU_EXPECTED_VERSION:-}
      TASKFORGE_MINERU_CACHE_ROOT: ${TASKFORGE_MINERU_CACHE_ROOT:-}
      TASKFORGE_MINERU_BACKEND: ${TASKFORGE_MINERU_BACKEND:-pipeline}
      TASKFORGE_MINERU_PARSE_METHOD: ${TASKFORGE_MINERU_PARSE_METHOD:-auto}
      TASKFORGE_MINERU_EFFORT: ${TASKFORGE_MINERU_EFFORT:-high}
      TASKFORGE_VISUAL_EXTRACTOR_BASE_URL: ${TASKFORGE_VISUAL_EXTRACTOR_BASE_URL:-}
      TASKFORGE_VISUAL_EXTRACTOR_API_KEY: ${TASKFORGE_VISUAL_EXTRACTOR_API_KEY:-}
      TASKFORGE_VISUAL_EXTRACTOR_MODEL: ${TASKFORGE_VISUAL_EXTRACTOR_MODEL:-}
      TASKFORGE_RESEARCH_QUERY_EXPANSION_MODE: ${TASKFORGE_RESEARCH_QUERY_EXPANSION_MODE:-original}
      TASKFORGE_RESEARCH_OPERATOR_BUDGET_STANDARD: ${TASKFORGE_RESEARCH_OPERATOR_BUDGET_STANDARD:-1}
      TASKFORGE_RESEARCH_OPERATOR_BUDGET_RIGOROUS: ${TASKFORGE_RESEARCH_OPERATOR_BUDGET_RIGOROUS:-2}
      TASKFORGE_PDF_CHUNKING_MODE: ${TASKFORGE_PDF_CHUNKING_MODE:-parent_child}
      TASKFORGE_PDF_FLAT_CHUNK_CHARS: ${TASKFORGE_PDF_FLAT_CHUNK_CHARS:-2000}
      TASKFORGE_OPENAI_API_KEY: ${TASKFORGE_OPENAI_API_KEY:-}
      TASKFORGE_OPENAI_MODEL: ${TASKFORGE_OPENAI_MODEL:-}
      TASKFORGE_OPENAI_BASE_URL: ${TASKFORGE_OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    volumes:
      - taskforge-data:/app/.taskforge
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    security_opt:
      - no-new-privileges:true

volumes:
  taskforge-data:
